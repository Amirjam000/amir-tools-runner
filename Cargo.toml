[package]
name = "amir_tools_bot"
version = "6.0.0"
edition = "2021"
description = "Amir Tools Telegram bot - native Rust port (yt-dlp downloads, web file agent, AI chat, admin & group tools)"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls", "gzip", "brotli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = "1"
scraper = "0.20"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = "0.8"
urlencoding = "2"
futures-util = "0.3"
qrcode = { version = "0.14", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
