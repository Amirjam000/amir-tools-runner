[package]
name = "amir_tools_bot"
version = "5.0.0"
edition = "2021"
authors = ["Amirjam000 <7243980602>"]
description = "100% Faithful Port of Amir Tools Telegram Bot Python Engine to High-Performance Rust"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
